<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Login — EdTech CRM</title>
  <link rel="stylesheet" href="/static/css/crm.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <h1 class="login-title">EdTech CRM</h1>
    <p class="login-subtitle">Staff Login</p>

    {% if messages %}
      {% for msg in messages %}
      <div class="alert alert-error">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'core:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus
               value="{{ request.POST.username|default:'' }}" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>
</body>
</html>
